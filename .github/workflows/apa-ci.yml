name: APA CI

on:
  push:
    branches: [main, poc]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 设计要求 Python >=3.12（见 apa/pyproject.toml requires-python）
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ./sdk/python \
                      -e ./apa/packages/apa-core \
                      -e ./apa/packages/apa-sdk-python \
                      -e ./apa/packages/apa-executors \
                      pyyaml jsonschema pytest httpx websockets
      - name: AIP conformance
        run: python conformance/run.py
      - name: APA-Profile conformance
        run: python apa/conformance/run.py
      - name: Tests
        working-directory: apa
        # 跳过真实浏览器 e2e（无浏览器缓存）与跨语言用例（独立 job）
        run: python -m pytest tests/ -q -m "not e2e" --ignore=tests/test_phase6.py
      - name: Examples (deterministic modes)
        run: |
          python apa/examples/hello-rpa/run.py --mock
          python apa/examples/invoice-processing/run.py
          python apa/examples/po-approval/run.py
          python apa/examples/po-approval/run.py --over

  typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 不启用 pnpm 缓存：sdk/typescript 无已提交的 pnpm-lock.yaml
      # （CI 内 pnpm import 从 package-lock 迁移生成），缓存路径无法解析
      - name: Build & test AIP TS SDK (pnpm)
        working-directory: sdk/typescript
        run: |
          pnpm import 2>/dev/null || true   # 由既有 package-lock 迁移锁文件
          pnpm install --no-frozen-lockfile
          pnpm test

  cross-language:
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install (python)
        run: |
          python -m pip install -U pip
          pip install -e ./sdk/python \
                      -e ./apa/packages/apa-core \
                      -e ./apa/packages/apa-sdk-python \
                      -e ./apa/packages/apa-executors \
                      pyyaml jsonschema pytest httpx websockets
      - name: Link @aip/protocol for the dsh plugin
        run: |
          mkdir -p apa/plugins/dsh/node_modules/@aip
          ln -s ../../../../../sdk/typescript apa/plugins/dsh/node_modules/@aip/protocol
      - name: Node client ↔ Python gateway E2E
        working-directory: apa
        run: python -m pytest tests/test_phase6.py -q