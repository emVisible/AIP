[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apa-core"
version = "0.1.0"
description = "APA (Agentic Process Automation) core: gateway, registry, policy, session, audit, rules"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "aip>=0.1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[tool.setuptools.packages.find]
include = ["apa_core*"]