[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apa-core"
version = "0.2.0"
description = "APA (Agentic Process Automation) core: gateway, registry, policy, session, audit, rules"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "aip>=0.1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "fastapi>=0.115",
    "sse-starlette>=2.1",
    "httpx>=0.27",
]

[project.scripts]
apa = "apa_core.cli:main"

[tool.setuptools.packages.find]
include = ["apa_core*"]