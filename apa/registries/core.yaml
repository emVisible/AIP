# ============================================================
# Core Action Registry — context.* / human.*
# 设计文档 §9.3。idempotency/risk 的唯一来源（C3）。
# ============================================================
context.get:
  executor_domain: any
  label_cn: 读取上下文变量
  description: "按需获取 ContextStore 中特定字段（CoD-2，禁止 fields: [\"*\"]）"
  params:
    type: object
    required: [ref, fields]
    properties:
      ref: { type: string, pattern: "^ctx_[A-Za-z0-9_]+$" }
      fields:
        type: array
        items: { type: string }
        minItems: 1
        not:
          enum: ["*"]
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 3
  audit_fields: [ref, fields]

mcp.tools_list:
  executor_domain: mcp
  label_cn: 列出外部 MCP 工具
  description: 枚举已配置外部 MCP 服务器的全部工具（APA_MCP_SERVERS 配置）
  params:
    type: object
    required: [server]
    properties:
      server:
        type: string
        description: APA_MCP_SERVERS 中的服务器名
  idempotency: required
  risk: L0
  timeout_ms: 60000
  retries: 1

mcp.tool_call:
  executor_domain: mcp
  label_cn: 调用外部 MCP 工具
  description: 调用外部 MCP 服务器的指定工具并取回文本结果
  params:
    type: object
    required: [server, tool]
    properties:
      server:
        type: string
        description: APA_MCP_SERVERS 中的服务器名
      tool:
        type: string
        description: 外部工具名（先经 mcp.tools_list 发现）
      arguments:
        type: object
        description: 工具入参（结构见该工具 inputSchema）
  idempotency: none
  risk: L2
  timeout_ms: 120000
  retries: 0
  audit_fields: [server, tool]

context.spill_read:
  executor_domain: any
  label_cn: 回读落盘结果
  description: 按 spill_ref 回读超大动作结果原文（H1 spill 中间件）
  when_to_use: 上游步骤声明 spill:true 后，需要完整数据时的取数通道
  params:
    type: object
    required: [ref]
    properties:
      ref:
        type: string
        description: 上游步骤输出中的 __spill__.spill_ref
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 1
  audit_fields: [ref]

context.update:
  executor_domain: any
  label_cn: 写入上下文变量
  description: "更新 ContextStore 中的字段"
  params:
    type: object
    required: [ref, fields]
    properties:
      ref: { type: string, pattern: "^ctx_[A-Za-z0-9_]+$" }
      fields: { type: object }
  idempotency: required
  risk: L1
  timeout_ms: 5000
  retries: 2
  audit_fields: [ref]

# ============================================================
# 人工干预域（human.*）— 通知操作，业务副作用来自后续 action
# ============================================================
human.task.create:
  executor_domain: any
  label_cn: 创建人工任务
  description: "创建人工审批/复核/异常任务（Session 挂起）"
  params:
    type: object
    required: [task_type, assignee_role, context_ref]
    properties:
      task_type: { enum: [approval, review, exception] }
      assignee_role: { type: string }
      context_ref: { type: string, pattern: "^ctx_[A-Za-z0-9_]+$" }
      available_outcomes: { type: array, items: { type: string } }
      due_at: { type: number }
      priority: { enum: [low, normal, high, urgent] }
  idempotency: required
  risk: L1
  timeout_ms: 5000
  retries: 2
  audit_fields: [task_type, assignee_role, context_ref]

human.task.cancel:
  executor_domain: any
  label_cn: 取消人工任务
  description: "取消人工任务并恢复/结束挂起的 Session"
  params:
    type: object
    required: [task_id, reason]
    properties:
      task_id: { type: string }
      reason: { type: string }
  idempotency: required
  risk: L1
  timeout_ms: 5000
  retries: 1
  audit_fields: [task_id, reason]

human.task.reassign:
  executor_domain: any
  label_cn: 转派人工任务
  description: "将人工任务转派给其他角色"
  params:
    type: object
    required: [task_id, to_assignee]
    properties:
      task_id: { type: string }
      from_assignee: { type: string }
      to_assignee: { type: string }
  idempotency: required
  risk: L1
  timeout_ms: 5000
  retries: 1
  audit_fields: [task_id, from_assignee, to_assignee]

# ============================================================
# M5 交互 + 代码段
# ============================================================
ui.confirm:
  executor_domain: core
  label_cn: 人工确认
  description: "阻塞式人工确认卡（复用 HITL：前端渲染确认按钮，超时默认 cancel）"
  params:
    type: object
    required: [message]
    properties:
      title: { type: string }
      message: { type: string }
      timeout_s: { type: number, minimum: 5, maximum: 3600 }
      assignee_role: { type: string, default: rpa_operator }
      context_ref: { type: string }
  idempotency: none
  risk: L1
  timeout_ms: 3700000
  retries: 0

code.python:
  executor_domain: data
  label_cn: 执行 Python 代码
  description: "独立 subprocess 执行 Python 片段；macOS Seatbelt 沙箱默认开启（写限工作区、网络拒绝）；timeout 强杀；risk=L3 默认策略强制人工审批"
  params:
    type: object
    required: [code]
    properties:
      code: { type: string, description: "完整 Python 脚本文本" }
      timeout_s: { type: number, minimum: 1, maximum: 600, default: 30 }
      sandbox:
        type: boolean
        default: true
        description: "Seatbelt 沙箱（darwin）：写限工作区/临时目录，网络拒绝"
  idempotency: none
  risk: L3
  timeout_ms: 620000
  retries: 0
  audit_fields: [code]
