data.clear:
  executor_domain: data
  label_cn: 清空表格
  description: 清空表格行（重放为 no-op，幂等）
  params:
    type: object
    required:
    - source
    properties:
      source:
        type: string
      keep_columns:
        type: boolean
        default: true
  idempotency: required
  risk: L1
  timeout_ms: 10000
  retries: 1
data.column_info:
  executor_domain: data
  label_cn: 列信息
  description: 列元信息：名称/类型推断/非空计数
  params:
    type: object
    required:
    - source
    properties:
      source:
        type: string
  idempotency: required
  risk: L0
  timeout_ms: 10000
  retries: 2
data.set_column_info:
  executor_domain: data
  label_cn: 设置列信息
  description: 设置列显示名与类型标注（元信息）
  params:
    type: object
    required:
    - source
    - column
    properties:
      source:
        type: string
      column:
        type: string
      new_name:
        type: string
      type_tag:
        type: string
  idempotency: required
  risk: L1
  timeout_ms: 10000
  retries: 1
file.zip:
  executor_domain: data
  label_cn: 压缩文件
  description: 打包文件/目录到 zip（目录递归，原子落盘）
  params:
    type: object
    required:
    - paths
    - dest
    properties:
      paths:
        type: array
        items:
          type: string
        minItems: 1
      dest:
        type: string
  idempotency: required
  risk: L1
  timeout_ms: 120000
  retries: 1
file.unzip:
  executor_domain: data
  label_cn: 解压文件
  description: 解压 zip 到目录（防路径穿越；同源重放覆盖幂等）
  params:
    type: object
    required:
    - src
    properties:
      src:
        type: string
      dest_dir:
        type: string
  idempotency: required
  risk: L1
  timeout_ms: 120000
  retries: 1
process.kill:
  executor_domain: data
  label_cn: 终止进程
  description: 终止进程（pid SIGTERM / name pkill 模糊匹配）
  params:
    type: object
    properties:
      pid:
        type: integer
        minimum: 1
      name:
        type: string
  idempotency: none
  risk: L3
  timeout_ms: 15000
  retries: 0
db.sqlite.query:
  executor_domain: data
  label_cn: SQLite 查询
  description: SQLite 查询（返回 columns+rows）
  params:
    type: object
    required:
    - db_path
    - sql
    properties:
      db_path:
        type: string
      sql:
        type: string
      params:
        type: array
  idempotency: required
  risk: L1
  timeout_ms: 30000
  retries: 2
db.sqlite.execute:
  executor_domain: data
  label_cn: SQLite 写入
  description: SQLite 写操作（INSERT/UPDATE/DELETE，返回受影响行数）
  params:
    type: object
    required:
    - db_path
    - sql
    properties:
      db_path:
        type: string
      sql:
        type: string
      params:
        type: array
  idempotency: none
  risk: L2
  timeout_ms: 30000
  retries: 0
notify.dingtalk:
  executor_domain: data
  label_cn: 钉钉通知
  description: 钉钉群机器人通知（text/markdown，可 @ 手机号）
  when_to_use: 钉钉群机器人预警/日报推送
  params:
    type: object
    required:
    - webhook_url
    - message
    properties:
      webhook_url:
        type: string
        format: uri
      msgtype:
        enum:
        - text
        - markdown
        default: text
      title:
        type: string
      message:
        type: string
      at_mobiles:
        type: array
        items:
          type: string
  idempotency: none
  risk: L1
  timeout_ms: 15000
  retries: 0
notify.wecom_webhook:
  executor_domain: data
  label_cn: 企微通知
  description: 企业微信群机器人 markdown 通知
  when_to_use: 企微群 markdown 通知
  params:
    type: object
    required:
    - webhook_url
    - message
    properties:
      webhook_url:
        type: string
        format: uri
      title:
        type: string
      message:
        type: string
  idempotency: none
  risk: L1
  timeout_ms: 15000
  retries: 0
notify.feishu_webhook:
  executor_domain: data
  label_cn: 飞书通知
  description: 飞书群机器人文本通知
  when_to_use: 飞书群文本通知
  params:
    type: object
    required:
    - webhook_url
    - message
    properties:
      webhook_url:
        type: string
        format: uri
      title:
        type: string
      message:
        type: string
  idempotency: none
  risk: L1
  timeout_ms: 15000
  retries: 0
