[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apa-sdk-python"
version = "0.1.0"
description = "APA developer SDK: executor base, resilience, dry-run, semantic adapter, testing helpers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "apa-core>=0.1.0",
    "aip>=0.1.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["apa_sdk*"]