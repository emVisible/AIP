[project]
name = "apa"
version = "1.0.0"
description = "APA — Agentic Process Automation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "sse-starlette>=2.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
        "websockets>=13.0",
    "pyobjc-core>=12.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=12.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=12.0; sys_platform == 'darwin'",
    "pyobjc-framework-AppKit>=12.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8.0", "pytest-asyncio", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100
