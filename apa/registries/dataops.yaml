      use_tls:
        type: boolean
        default: true
      from:
        type: string
      to:
        type: string
      cc:
        type: string
      subject:
        type: string
      body:
        type: string
      body_type:
        enum:
        - plain
        - html
        default: plain
      attachments:
        type: array
        items:
          type: string
  idempotency: none
  risk: L2
  timeout_ms: 60000
  retries: 0
  audit_fields:
  - to
  - subject
