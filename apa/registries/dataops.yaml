email.send:
  executor_domain: email
  label_cn: 发送邮件
  description: SMTP 发送邮件（TLS，支持附件/CC）；C4：password 走凭据注入
  when_to_use: 发送通知/报表邮件，支持附件与抄送
  params:
    type: object
    required:
    - to
    - subject
    properties:
      smtp_host:
        type: string
      smtp_port:
        type: integer
        minimum: 1
        maximum: 65535
      username:
        type: string
      password:
        type: string
