# ============================================================
# DataOps Action Registry — data.* / file.* / string.* / email.*
# C3：读操作 required+retries>0；写/发操作 none+retries=0
# ============================================================
data.create:
  executor_domain: data
  description: "创建内存表格（columns + rows；同键覆盖幂等）"
  params:
    type: object
    required: [columns]
    properties:
      columns: { type: array, items: { type: string } }
      rows:
        type: array
        items: { type: array }
      key: { type: string, default: default, description: "表格存储键" }
  idempotency: required
  risk: L0
  timeout_ms: 30000
  retries: 1

data.filter:
  executor_domain: data
  description: "按列条件过滤表格行"
  params:
    type: object
    required: [source, column, op, value]
    properties:
      source: { type: string }
      column: { type: string }
      op: { enum: ["==", "!=", ">", ">=", "<", "<=", contains, startswith] }
      value: {}
      output_key: { type: string, default: filtered }
  idempotency: required
  risk: L0
  timeout_ms: 30000
  retries: 2

data.sort:
  executor_domain: data
  description: "按列排序表格"
  params:
    type: object
    required: [source, column]
    properties:
      source: { type: string }
      column: { type: string }
      reverse: { type: boolean, default: false }
      output_key: { type: string, default: sorted }
  idempotency: required
  risk: L0
  timeout_ms: 30000
  retries: 2

data.to_csv:
  executor_domain: data
  description: "表格序列化为 CSV 文本"
  params:
    type: object
    required: [source]
    properties:
      source: { type: string }
  idempotency: required
  risk: L0
  timeout_ms: 30000
  retries: 2

file.read_text:
  executor_domain: data
  description: "读取文本文件（UTF-8）"
  params:
    type: object
    required: [path]
    properties:
      path: { type: string }
  idempotency: required
  risk: L1
  timeout_ms: 15000
  retries: 2

file.write_text:
  executor_domain: data
  description: "写文本文件（同内容重写幂等）"
  params:
    type: object
    required: [path, content]
    properties:
      path: { type: string }
      content: { type: string }
  idempotency: required
  risk: L2
  timeout_ms: 15000
  retries: 1

string.replace:
  executor_domain: data
  description: "字符串替换"
  params:
    type: object
    required: [text, old, new]
    properties:
      text: { type: string }
      old: { type: string }
      new: { type: string }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

string.split:
  executor_domain: data
  description: "字符串分隔 → parts 数组"
  params:
    type: object
    required: [text]
    properties:
      text: { type: string }
      delimiter: { type: string, default: "," }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

email.send:
  executor_domain: email
  description: "SMTP 发送邮件（TLS，支持附件/CC）；C4：password 走凭据注入"
  when_to_use: "发送通知/报表邮件，支持附件与抄送"
  params:
    type: object
    required: [to, subject]
    properties:
      smtp_host: { type: string }
      smtp_port: { type: integer, minimum: 1, maximum: 65535 }
      username: { type: string }
      password: { type: string, writeOnly: true }
      use_tls: { type: boolean, default: true }
      from: { type: string }
      to: { type: string }
      cc: { type: string }
      subject: { type: string }
      body: { type: string }
      body_type: { enum: [plain, html], default: plain }
      attachments: { type: array, items: { type: string } }
  idempotency: none
  risk: L2
  timeout_ms: 60000
  retries: 0
  audit_fields: [to, subject]
# ============================================================
# M1 数据工具包（string/encode/json/dt/hash/uuid/data 增强）
# 全部纯函数：idempotency=required + retries
# ============================================================
string.regex_extract:
  executor_domain: data
  description: "正则提取所有匹配（可指定分组）"
  params:
    type: object
    required: [text, pattern]
    properties:
      text: { type: string }
      pattern: { type: string }
      group: { type: integer, minimum: 0, default: 0 }
      ignore_case: { type: boolean, default: false }
  idempotency: required
  risk: L0
  timeout_ms: 10000
  retries: 2

string.regex_replace:
  executor_domain: data
  description: "正则替换"
  params:
    type: object
    required: [text, pattern]
    properties:
      text: { type: string }
      pattern: { type: string }
      repl: { type: string, default: "" }
  idempotency: required
  risk: L0
  timeout_ms: 10000
  retries: 2

string.regex_test:
  executor_domain: data
  description: "正则匹配测试"
  params:
    type: object
    required: [text, pattern]
    properties:
      text: { type: string }
      pattern: { type: string }
  idempotency: required
  risk: L0
  timeout_ms: 10000
  retries: 2

string.trim:
  executor_domain: data
  description: "去除首尾空白"
  params:
    type: object
    required: [text]
    properties: { text: { type: string } }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

string.upper:
  executor_domain: data
  description: "转大写"
  params:
    type: object
    required: [text]
    properties: { text: { type: string } }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

string.lower:
  executor_domain: data
  description: "转小写"
  params:
    type: object
    required: [text]
    properties: { text: { type: string } }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

string.format_template:
  executor_domain: data
  description: "{name} 占位模板填充（缺变量保留原样）"
  params:
    type: object
    required: [template]
    properties:
      template: { type: string }
      vars: { type: object, additionalProperties: true }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

string.pad:
  executor_domain: data
  description: "定宽填充；align 指填充侧（left=左补齐）"
  params:
    type: object
    required: [text, width]
    properties:
      text: { type: string }
      width: { type: integer, minimum: 1 }
      fillchar: { type: string, default: " " }
      align: { enum: [left, right, center], default: left }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

string.starts_with:
  executor_domain: data
  description: "前缀判断"
  params:
    type: object
    required: [text, prefix]
    properties:
      text: { type: string }
      prefix: { type: string }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

string.contains:
  executor_domain: data
  description: "包含判断（可选忽略大小写）"
  params:
    type: object
    required: [text, needle]
    properties:
      text: { type: string }
      needle: { type: string }
      ignore_case: { type: boolean, default: false }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

encode.base64_encode:
  executor_domain: data
  description: "Base64 编码"
  params:
    type: object
    required: [text]
    properties: { text: { type: string } }
  idempotency: required
  risk: L0
  timeout_ms: 10000
  retries: 2

encode.base64_decode:
  executor_domain: data
  description: "Base64 解码（非 UTF-8 时回传 result_b64）"
  params:
    type: object
    required: [b64]
    properties: { b64: { type: string } }
  idempotency: required
  risk: L0
  timeout_ms: 10000
  retries: 2

encode.url_encode:
  executor_domain: data
  description: "URL 百分号编码（safe 为空串，全字符转义）"
  params:
    type: object
    required: [text]
    properties: { text: { type: string } }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

encode.url_decode:
  executor_domain: data
  description: "URL 解码"
  params:
    type: object
    required: [text]
    properties: { text: { type: string } }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

json.parse:
  executor_domain: data
  description: "JSON 文本 → 值"
  params:
    type: object
    required: [text]
    properties: { text: { type: string } }
  idempotency: required
  risk: L0
  timeout_ms: 10000
  retries: 2

json.stringify:
  executor_domain: data
  description: "值 → JSON 文本"
  params:
    type: object
    required: [value]
    properties:
      value: {}
      indent: { type: integer, minimum: 0, maximum: 8 }
  idempotency: required
  risk: L0
  timeout_ms: 10000
  retries: 2

dt.now:
  executor_domain: data
  description: "当前时间（iso/formatted/epoch 三态输出；非幂等不重试）"
  params:
    type: object
    properties: { fmt: { type: string } }
  idempotency: none
  risk: L0
  timeout_ms: 5000
  retries: 0

dt.parse:
  executor_domain: data
  description: "文本 → ISO 时间（无 fmt 则 ISO 解析）"
  params:
    type: object
    required: [text]
    properties:
      text: { type: string }
      fmt: { type: string }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

dt.add:
  executor_domain: data
  description: "时间加减（days/hours/minutes/seconds）"
  params:
    type: object
    required: [iso]
    properties:
      iso: { type: string }
      days: { type: number }
      hours: { type: number }
      minutes: { type: number }
      seconds: { type: number }
      fmt: { type: string }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

dt.diff:
  executor_domain: data
  description: "两时间差值（b-a，单位 seconds/minutes/hours/days）"
  params:
    type: object
    required: [a, b]
    properties:
      a: { type: string }
      b: { type: string }
      unit: { enum: [seconds, minutes, hours, days], default: seconds }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

dt.timestamp:
  executor_domain: data
  description: "ISO → Unix 时间戳"
  params:
    type: object
    required: [iso]
    properties:
      iso: { type: string }
      fmt: { type: string }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

hash.md5:
  executor_domain: data
  description: "MD5 摘要"
  params:
    type: object
    required: [text]
    properties: { text: { type: string } }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

hash.sha256:
  executor_domain: data
  description: "SHA-256 摘要"
  params:
    type: object
    required: [text]
    properties: { text: { type: string } }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

uuid.gen:
  executor_domain: data
  description: "UUID v4 生成（非幂等不重试）"
  params: { type: object, properties: {} }
  idempotency: none
  risk: L0
  timeout_ms: 5000
  retries: 0

data.aggregate:
  executor_domain: data
  description: "列聚合 sum/avg/min/max/count"
  params:
    type: object
    required: [source, column]
    properties:
      source: { type: string }
      column: { type: string }
      func: { enum: [sum, avg, min, max, count], default: sum }
  idempotency: required
  risk: L0
  timeout_ms: 30000
  retries: 2

data.distinct:
  executor_domain: data
  description: "按列去重保留首现行"
  params:
    type: object
    required: [source, column]
    properties:
      source: { type: string }
      column: { type: string }
      output_key: { type: string, default: distinct }
  idempotency: required
  risk: L0
  timeout_ms: 30000
  retries: 2

data.slice:
  executor_domain: data
  description: "行切片 [start, stop)"
  params:
    type: object
    required: [source]
    properties:
      source: { type: string }
      start: { type: integer, minimum: 0, default: 0 }
      stop: { type: integer, minimum: 0 }
      output_key: { type: string, default: sliced }
  idempotency: required
  risk: L0
  timeout_ms: 30000
  retries: 2

data.json_to_table:
  executor_domain: data
  description: "dict 列表 → 内存表格（列取键并集保序）"
  params:
    type: object
    required: [items]
    properties:
      items: { type: array, items: { type: object } }
      key: { type: string, default: from_json }
  idempotency: required
  risk: L0
  timeout_ms: 30000
  retries: 2

# ============================================================
# M2 流程控制配套
# ============================================================
core.delay:
  executor_domain: data
  description: "等待 N 秒（上限 300s；非幂等不重试）"
  params:
    type: object
    required: [seconds]
    properties:
      seconds: { type: number, minimum: 0, maximum: 300 }
  idempotency: none
  risk: L0
  timeout_ms: 310000
  retries: 0

data.count:
  executor_domain: data
  description: "读取内存表格行数（while 条件配套）"
  params:
    type: object
    required: [source]
    properties:
      source: { type: string }
  idempotency: required
  risk: L0
  timeout_ms: 10000
  retries: 2

# ============================================================
# M4 系统 / 文件
# ============================================================
shell.execute:
  executor_domain: data
  description: "执行 shell 命令（超时强杀；审计 cmd；可能有任意副作用）"
  params:
    type: object
    required: [cmd]
    properties:
      cmd: { type: string }
      timeout_s: { type: number, minimum: 1, maximum: 600, default: 30 }
  idempotency: none
  risk: L2
  timeout_ms: 620000
  retries: 0
  audit_fields: [cmd]

sys.notify:
  executor_domain: data
  description: "桌面通知（macOS 通知中心，其他平台 stdout 降级）"
  params:
    type: object
    required: [message]
    properties:
      title: { type: string, default: APA }
      message: { type: string }
  idempotency: none
  risk: L1
  timeout_ms: 15000
  retries: 0

clipboard.set:
  executor_domain: data
  description: "写系统剪贴板（同值重放幂等；darwin）"
  params:
    type: object
    required: [text]
    properties: { text: { type: string } }
  idempotency: required
  risk: L1
  timeout_ms: 5000
  retries: 1

clipboard.get:
  executor_domain: data
  description: "读系统剪贴板文本（读操作可重试）"
  params: { type: object, properties: {} }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

file.list_dir:
  executor_domain: data
  description: "目录列举（glob pattern，含 is_dir/size）"
  params:
    type: object
    required: [path]
    properties:
      path: { type: string }
      pattern: { type: string, default: "*" }
  idempotency: required
  risk: L0
  timeout_ms: 30000
  retries: 2

file.mkdir:
  executor_domain: data
  description: "创建目录（已存在为 no-op，幂等）"
  params:
    type: object
    required: [path]
    properties:
      path: { type: string }
      parents: { type: boolean, default: true }
  idempotency: required
  risk: L1
  timeout_ms: 10000
  retries: 1

file.exists:
  executor_domain: data
  description: "路径存在性检查"
  params:
    type: object
    required: [path]
    properties: { path: { type: string } }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

file.stat:
  executor_domain: data
  description: "文件元信息（size/mtime_iso/is_dir）"
  params:
    type: object
    required: [path]
    properties: { path: { type: string } }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

email.receive:
  executor_domain: email
  description: "IMAP 拉取邮件（默认 BODY.PEEK 不标已读，只读可重试）"
  when_to_use: "拉取邮箱邮件（客服质检/订单通知场景入口）"
  params:
    type: object
    required: [host, username]
    properties:
      host: { type: string }
      port: { type: integer, default: 993 }
      username: { type: string }
      password: { type: string, writeOnly: true }
      folder: { type: string, default: INBOX }
      criteria: { type: string, default: UNSEEN }
      limit: { type: integer, minimum: 1, maximum: 100, default: 10 }
      mark_seen: { type: boolean, default: false }
  idempotency: required
  risk: L1
  timeout_ms: 60000
  retries: 2


data.merge:
  executor_domain: data
  description: "两表合并：concat 纵向拼接 / inner|left 按 key 连接"
  params:
    type: object
    required: [a, b]
    properties:
      a: { type: string }
      b: { type: string }
      how: { enum: [concat, inner, left], default: concat }
      on: { type: string, description: "连接键（join 模式必填）" }
      output_key: { type: string, default: merged }
  idempotency: required
  risk: L0
  timeout_ms: 30000
  retries: 2


if.file_exists:
  executor_domain: data
  description: "谓词：文件是否存在 → matched"
  params:
    type: object
    required: [path]
    properties: { path: { type: string } }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

if.dir_exists:
  executor_domain: data
  description: "谓词：目录是否存在 → matched"
  params:
    type: object
    required: [path]
    properties: { path: { type: string } }
  idempotency: required
  risk: L0
  timeout_ms: 5000
  retries: 2

wait.file:
  executor_domain: data
  description: "轮询等待 glob 首个命中文件（返回 path）"
  params:
    type: object
    required: [glob]
    properties:
      glob: { type: string }
      timeout_s: { type: number, minimum: 0.5, maximum: 600, default: 30 }
      interval_s: { type: number, minimum: 0.05, maximum: 5, default: 0.5 }
  idempotency: optional
  risk: L0
  timeout_ms: 620000
  retries: 0
