data.create:
  executor_domain: data
  label_cn: 创建表格
  description: 创建内存表格（columns + rows；同键覆盖幂等）
  params:
    type: object
    required:
    - columns
    properties:
      columns:
        type: array
        items:
          type: string
      rows:
        type: array
        items:
          type: array
      key:
        type: string
        default: default
        description: 表格存储键
  idempotency: required
  risk: L0
  timeout_ms: 30000
  retries: 1
data.filter:
  executor_domain: data
  label_cn: 过滤表格
  description: 按列条件过滤表格行
  when_to_use: 按条件过滤表格行（金额>阈值/状态=待审）
  params:
    type: object
    required:
    - source
    - column
    - op
    - value
    properties:
      source:
        type: string
      column:
        type: string
      op:
        enum:
        - ==
        - '!='
        - '>'
        - '>='
        - <
        - <=
        - contains
        - startswith
      value: {}
      output_key:
        type: string
        default: filtered
  idempotency: required
  risk: L0
  timeout_ms: 30000
  retries: 2
data.sort:
  executor_domain: data
  label_cn: 排序表格
  description: 按列排序表格
  when_to_use: 按列排序
  params:
    type: object
    required:
    - source
    - column
    properties:
      source:
        type: string
      column:
        type: string
      reverse:
        type: boolean
        default: false
      output_key:
        type: string
        default: sorted
  idempotency: required
  risk: L0
  timeout_ms: 30000
  retries: 2
data.to_csv:
  executor_domain: data
  label_cn: 表格转 CSV
  description: 表格序列化为 CSV 文本
