[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aip"
version = "0.1.0"
description = "AIP (AI Interaction Protocol) Kernel v0.1 — Python SDK"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
ws = ["websockets>=12"]
validate = ["jsonschema>=4"]

[tool.setuptools.packages.find]
include = ["aip*"]